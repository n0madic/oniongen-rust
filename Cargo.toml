[package]
name = "oniongen"
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
data-encoding = "2.10"
num_cpus = "1.17"
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.11"
regex = "1.12"
sha3 = "0.10"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "keygen"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
